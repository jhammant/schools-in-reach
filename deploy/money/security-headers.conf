# Security headers for every School Money response (audit C65). nginx.conf.template includes this file in the server
# block and again in each location that sets its own add_header, because nginx drops inherited add_header lines in a
# block that has any of its own. The Dockerfile copies it to /etc/nginx/snippets/security-headers.conf.
#
# Framing: $money_frame_ancestors and $money_frame_options come from maps in the template. Every page sends
# frame-ancestors 'none' and X-Frame-Options DENY except /embed/, the badge other sites put in an iframe (an empty
# X-Frame-Options value makes nginx leave the header out).
#
# Content-Security-Policy, exactly what the pages load (tests/test_deploy_money.py checks every external URL in the
# built pages and shipped scripts against it):
#   script-src  this site; the one inline script, site.AUDIENCE_BOOT, by its hash (JSON and ld+json blocks are data,
#               not run); Leaflet and qrcode-generator from cdnjs, protomaps-leaflet, PptxGenJS and mp4-muxer from
#               jsDelivr, each pinned to its version's path (all also carry SRI hashes).
#   style-src   'unsafe-inline' because charts and cards set style attributes; Leaflet's stylesheet from cdnjs.
#   img-src     data: (QR codes, Leaflet, protomaps icons), blob: (video frames), Leaflet's images, map tiles.
#   connect-src api.postcodes.io (a full postcode, on Search) and the map tiles (range requests).
#   media-src / worker-src blob: for the 30-second video export.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options $money_frame_options always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-kNUvP9Y/xpO5w5r6x+CRMJAa2TWVkQkZ6v96ngMlwMM=' https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/ https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/ https://cdn.jsdelivr.net/npm/protomaps-leaflet@5.1.0/ https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/ https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/; img-src 'self' data: blob: https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/ https://tiles.schoolsinreach.com; connect-src 'self' https://api.postcodes.io https://tiles.schoolsinreach.com; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $money_frame_ancestors" always;
