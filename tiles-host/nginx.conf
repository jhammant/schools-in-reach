server {
  listen 80;
  root /usr/share/nginx/html;

  location /tiles/ {
    # The site on another hostname fetches byte ranges with fetch(), so CORS must allow and expose Range.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-Match, If-None-Match" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag, Accept-Ranges" always;
    add_header Cache-Control "public, max-age=86400" always;
    if ($request_method = OPTIONS) { return 204; }
  }

  location = /health { default_type text/plain; }
}
